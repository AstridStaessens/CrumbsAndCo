<div class="auth-page">
  <div class="auth-card">
    <h1>Nieuw wachtwoord instellen</h1>

    @if (linkMissing) {
      <div class="error-message">
        Deze link is ongeldig. Vraag een nieuwe wachtwoordreset aan.
      </div>
      <p class="auth-link">
        <a routerLink="/forgot-password">Wachtwoord vergeten</a>
      </p>
    } @else if (submitted) {
      <div class="success-message">
        <p>Je wachtwoord is succesvol gewijzigd. Je kan nu inloggen met je nieuwe wachtwoord.</p>
      </div>
      <button type="button" class="submit-btn" (click)="goToLogin()">Naar inloggen</button>
    } @else {
      @if (error) {
        <div class="error-message">{{ error }}</div>
      }

      <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="form-group">
          <label for="newPassword">Nieuw wachtwoord</label>
          <div class="password-field">
            <input
              id="newPassword"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="••••••••"
              minlength="6"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('new')"
              [attr.aria-label]="showPassword ? 'Wachtwoord verbergen' : 'Wachtwoord weergeven'"
              tabindex="-1"
            >
              @if (showPassword) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Bevestig wachtwoord</label>
          <div class="password-field">
            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="••••••••"
              minlength="6"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('confirm')"
              [attr.aria-label]="showConfirmPassword ? 'Wachtwoord verbergen' : 'Wachtwoord weergeven'"
              tabindex="-1"
            >
              @if (showConfirmPassword) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading || f.invalid">
          {{ isLoading ? 'Bezig...' : 'Wachtwoord wijzigen' }}
        </button>
      </form>
    }
  </div>
</div>
