<div class="auth-page">
  <div class="auth-card">
    <h1>Registreren</h1>

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="name">Naam</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Jouw naam"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">E-mailadres</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="jouw@email.be"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Min. 6 tekens, met hoofdletter, cijfer en symbool"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Wachtwoord verbergen' : 'Wachtwoord weergeven'"
            tabindex="-1"
          >
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
        <small class="field-hint">
          Wachtwoord moet minstens 6 tekens bevatten, met minstens 1 hoofdletter, 1 kleine letter, 1 cijfer en 1 speciaal teken (bv. !&#64;#$%).
        </small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'Bezig...' : 'Registreren' }}
      </button>
    </form>

    <p class="auth-link">
      Al een account? <a routerLink="/login">Inloggen</a>
    </p>
  </div>
</div>
