<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <img src="assets/logo.png" alt="Crumbs & Co" class="logo-img" />
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/shop" routerLinkActive="active">Webshop</a>
      <a routerLink="/op-maat" routerLinkActive="active">Op maat</a>
      <a routerLink="/galerij" routerLinkActive="active">Galerij</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>

      @if (authService.isLoggedIn()) {
        <a routerLink="/account" class="user-name">{{ authService.currentUser()?.name }}</a>
        @if (authService.isAdmin()) {
          <a routerLink="/admin" class="auth-button">Admin</a>
        }
        <button class="auth-button" (click)="logout()">Uitloggen</button>
      } @else {
        <a routerLink="/login" class="auth-button">Inloggen</a>
      }

      <button class="cart-button" (click)="cartClick.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Bestelling
        @if ((totalCount$ | async)! > 0) {
          <span class="cart-badge">{{ totalCount$ | async }}</span>
        }
      </button>
    </nav>
  </div>
</header>
